[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lager"
version = "0.1.0"
description = "Household inventory management with barcode scanning, FIFO consumption, and expiry tracking."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<0.137",
    "uvicorn[standard]>=0.25,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<2.8",
    "httpx>=0.26,<1",
    "python-multipart>=0.0.6",
    "structlog>=24.1,<26",
    "prometheus-fastapi-instrumentator>=7.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.2,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
